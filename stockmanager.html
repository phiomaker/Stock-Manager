<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Manager Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family: Arial; background:#f4f6f9; padding:20px;}
.container {display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.card {background:#fff; padding:15px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
input {width:100%; padding:8px; margin-top:8px;}
button {padding:8px 10px; margin-top:8px; border:none; cursor:pointer; border-radius:6px;}
.add {background:#007bff; color:white;}
.sell {background:#28a745; color:white;}
.delete {background:#dc3545; color:white;}
table {width:100%; margin-top:15px; border-collapse:collapse;}
th,td {padding:8px; border-bottom:1px solid #ddd; text-align:center;}
.history {font-size:12px; text-align:left;}
@media(max-width:800px){.container{grid-template-columns:1fr;}}
</style>
</head>

<body>

<h2>📦 Stock Manager Pro (Sales Tracking)</h2>

<div class="container">

<!-- ADD PRODUCT -->
<div class="card">
<h3>Add Product</h3>
<input id="name" placeholder="Product Name">
<input id="category" placeholder="Category">
<input id="qty" type="number" placeholder="Stock Quantity">
<input id="price" type="number" placeholder="Price">
<button class="add" onclick="addProduct()">Add</button>
</div>

<!-- SELL PRODUCT -->
<div class="card">
<h3>Record Sale</h3>
<select id="productSelect"></select>
<input id="seller" placeholder="Seller Name">
<input id="buyer" placeholder="Buyer Name">
<input id="address" placeholder="Buyer Address">
<button class="sell" onclick="sellItem()">Record Sale</button>
</div>

</div>

<!-- TABLE -->
<div class="card">
<h3>Inventory</h3>
<table>
<thead>
<tr>
<th>Product</th>
<th>Stock</th>
<th>Sold</th>
<th>Sales History</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

<script>

let products = JSON.parse(localStorage.getItem("products")) || [];

function save(){
  localStorage.setItem("products", JSON.stringify(products));
}

function addProduct(){
  products.push({
    id:Date.now(),
    name:document.getElementById("name").value,
    category:document.getElementById("category").value,
    stock:parseInt(document.getElementById("qty").value),
    sold:0,
    price:parseFloat(document.getElementById("price").value),
    history:[]
  });

  save();
  render();
}

function sellItem(){
  let index = document.getElementById("productSelect").value;
  if(index === "") return;

  let p = products[index];

  if(p.stock <= 0){
    alert("Out of stock");
    return;
  }

  p.stock -= 1;
  p.sold += 1;

  p.history.push({
    time:new Date().toLocaleString(),
    seller:document.getElementById("seller").value,
    buyer:document.getElementById("buyer").value,
    address:document.getElementById("address").value
  });

  save();
  render();
}

function render(){

  // dropdown
  let sel = document.getElementById("productSelect");
  sel.innerHTML = "";

  products.forEach((p,i)=>{
    sel.innerHTML += `<option value="${i}">${p.name}</option>`;
  });

  // table
  let table = document.getElementById("table");
  table.innerHTML = "";

  products.forEach((p,i)=>{

    let historyHTML = p.history.map(h=>
      `<div class="history">
        🕒 ${h.time}<br>
        👤 Seller: ${h.seller}<br>
        🧑 Buyer: ${h.buyer}<br>
        📍 ${h.address}
      </div><hr>`
    ).join("");

    table.innerHTML += `
      <tr>
        <td>${p.name}</td>
        <td>${p.stock}</td>
        <td>${p.sold}</td>
        <td>${historyHTML || "No sales yet"}</td>
        <td>
          <button class="delete" onclick="del(${i})">Delete</button>
        </td>
      </tr>
    `;
  });
}

function del(i){
  products.splice(i,1);
  save();
  render();
}

render();

</script>

</body>
</html>
