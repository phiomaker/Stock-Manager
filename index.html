<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stock & Sales Manager</title>
<style>
  body { font-family: Arial; margin: 20px; }
  input, button { margin: 5px; padding: 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
  th { background: #f2f2f2; }
</style>
</head>

<body>

<h2>📦 Stock & Sales Manager</h2>

<!-- STOCK SECTION -->
<h3>Add Stock</h3>
<input type="text" id="stockName" placeholder="Product Name">
<input type="number" id="stockQty" placeholder="Quantity">
<button onclick="addStock()">Add Stock</button>

<h3>Current Stock</h3>
<table id="stockTable">
  <tr>
    <th>Product</th>
    <th>Quantity</th>
  </tr>
</table>

<hr>

<!-- SALES SECTION -->
<h3>Record Sale</h3>

<input type="text" id="product" placeholder="Product Name">
<input type="number" id="qty" placeholder="Quantity Sold">

<input type="text" id="buyerName" placeholder="Buyer Name">
<input type="text" id="buyerAddress" placeholder="Buyer Address">

<input type="text" id="sellerName" placeholder="Seller Name">
<input type="text" id="sellerBranch" placeholder="Seller Branch">

<button onclick="recordSale()">Submit Sale</button>

<h3>Sales History</h3>
<table id="salesTable">
  <tr>
    <th>Time</th>
    <th>Product</th>
    <th>Qty</th>
    <th>Buyer</th>
    <th>Address</th>
    <th>Seller</th>
    <th>Branch</th>
  </tr>
</table>

<script>
// ================= STOCK =================
function addStock() {
  let name = document.getElementById("stockName").value;
  let qty = parseInt(document.getElementById("stockQty").value);

  let stock = JSON.parse(localStorage.getItem("stock")) || {};

  if (!stock[name]) {
    stock[name] = 0;
  }

  stock[name] += qty;

  localStorage.setItem("stock", JSON.stringify(stock));

  displayStock();
}

// ================= DISPLAY STOCK =================
function displayStock() {
  let stock = JSON.parse(localStorage.getItem("stock")) || {};

  let table = document.getElementById("stockTable");

  table.innerHTML = `
    <tr>
      <th>Product</th>
      <th>Quantity</th>
    </tr>
  `;

  for (let item in stock) {
    let row = table.insertRow();
    row.innerHTML = `
      <td>${item}</td>
      <td>${stock[item]}</td>
    `;
  }
}

// ================= RECORD SALE =================
function recordSale() {
  let product = document.getElementById("product").value;
  let qty = parseInt(document.getElementById("qty").value);

  let buyerName = document.getElementById("buyerName").value;
  let buyerAddress = document.getElementById("buyerAddress").value;

  let sellerName = document.getElementById("sellerName").value;
  let sellerBranch = document.getElementById("sellerBranch").value;

  let stock = JSON.parse(localStorage.getItem("stock")) || {};

  // reduce stock
  if (stock[product]) {
    stock[product] -= qty;
    if (stock[product] < 0) stock[product] = 0;
  }

  localStorage.setItem("stock", JSON.stringify(stock));

  // save sale
  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  sales.push({
    time: new Date().toLocaleString(),
    product,
    qty,
    buyerName,
    buyerAddress,
    sellerName,
    sellerBranch
  });

  localStorage.setItem("sales", JSON.stringify(sales));

  displayStock();
  displaySales();
}

// ================= DISPLAY SALES =================
function displaySales() {
  let sales = JSON.parse(localStorage.getItem("sales")) || [];

  let table = document.getElementById("salesTable");

  table.innerHTML = `
    <tr>
      <th>Time</th>
      <th>Product</th>
      <th>Qty</th>
      <th>Buyer</th>
      <th>Address</th>
      <th>Seller</th>
      <th>Branch</th>
    </tr>
  `;

  sales.forEach(s => {
    let row = table.insertRow();
    row.innerHTML = `
      <td>${s.time}</td>
      <td>${s.product}</td>
      <td>${s.qty}</td>
      <td>${s.buyerName}</td>
      <td>${s.buyerAddress}</td>
      <td>${s.sellerName}</td>
      <td>${s.sellerBranch}</td>
    `;
  });
}

// ================= LOAD ON START =================
window.onload = function () {
  displayStock();
  displaySales();
};
</script>

</body>
</html>
